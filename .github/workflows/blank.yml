
name: ci-cd


on:

  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]


  workflow_dispatch:


jobs:
  
  lint:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
  

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip- 
    
      - name: install Deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Style checking
        run: make lint

    
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    
    
    services:
      mongodb:
        image: mongo:4.4.6
        env:
          MONGO_INITDB_DATABASE: TestPetProjectDatabase
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        - uses: actions/checkout@v4
  
        - name: Install mongosh
          run: |
            sudo apt-get install gnupg
            wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo tee /etc/apt/trusted.gpg.d/server-7.0.asc
            echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
            sudo apt-get update
            sudo apt-get install -y mongodb-mongosh
            mongosh --version

        - name: Initalize MongoDB
          run: |
            mongosh --host localhost:27017
              db = db.getSiblingDB('APP-DB');
              db.createUser({ user: 'APP-USERNAME', pwd: 'APP-PASSWORD', roles: [{ role: 'readWrite', db: 'APP-DB' }] })
              db.createCollection('APP-COLLECTION');
          
            
        - name: Initialize python 3.12
          uses: actions/setup-python@v5
          with:
            python-version: '3.12'
            
        - name: Cache Python dependencies
          uses: actions/cache@v3
          with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
            restore-keys: |
              ${{ runner.os }}-pip- 
        - name: Create .env file
          run: |
            echo "${{ secrets.SECRET_ENV }}" > .env
            
        - name: install Deps
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          
        - name: Testing
          run: make tests
  


        
  build:
    needs: [test]
  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: build_container
        run: make docker_build
  
      - name: container_down
        run: docker_down
